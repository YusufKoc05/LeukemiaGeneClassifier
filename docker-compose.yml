version: '3.8'

services:
  oncovision-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oncovision_ai_app
    ports:
      - "7860:7860"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
    restart: unless-stopped
